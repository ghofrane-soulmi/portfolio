<!doctype html>
<!--
  Source for public/og-image.png (1200x630).
  Regenerate with: npm run og:image   (needs Chrome or Edge installed)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #0b0f14;
        color: #e6edf3;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          Roboto,
          Arial,
          sans-serif;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, #253040 1px, transparent 1px),
          linear-gradient(to bottom, #253040 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(ellipse at 30% 40%, black 10%, transparent 70%);
        opacity: 0.55;
      }
      .glow {
        position: absolute;
        width: 760px;
        height: 760px;
        right: -220px;
        top: -260px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(45, 212, 191, 0.28), transparent 65%);
      }
      .content {
        position: absolute;
        left: 88px;
        top: 110px;
        right: 88px;
      }
      .mono {
        font-family: Consolas, 'SFMono-Regular', Menlo, monospace;
      }
      .tag {
        color: #2dd4bf;
        font-size: 28px;
      }
      h1 {
        margin: 22px 0 0;
        font-size: 104px;
        line-height: 1.02;
        font-weight: 800;
        letter-spacing: -2px;
      }
      p {
        margin: 26px 0 0;
        font-size: 38px;
        color: #9aa7b4;
      }
      .footer {
        position: absolute;
        left: 88px;
        right: 88px;
        bottom: 70px;
        display: flex;
        justify-content: space-between;
        font-size: 24px;
        color: #9aa7b4;
      }
      .footer b {
        color: #2dd4bf;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="content">
      <div class="mono tag">&lt;Full Stack Developer /&gt;</div>
      <h1>Ghofrane Soulmi</h1>
      <p>Laravel · Vue.js 3 · TypeScript</p>
    </div>
    <div class="footer mono">
      <span>Tunis, Tunisia</span>
      <span><b>Portfolio</b> &amp; case studies</span>
    </div>
  </body>
</html>
