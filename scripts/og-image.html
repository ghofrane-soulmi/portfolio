<!doctype html>
<!--
  Source for public/og-image.png (1200x630).
  Regenerate with: npm run og:image   (needs Chrome or Edge installed)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #fff7fa;
        color: #2e1a2b;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          Roboto,
          Arial,
          sans-serif;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, #f5d5e3 1px, transparent 1px),
          linear-gradient(to bottom, #f5d5e3 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(ellipse at 30% 40%, black 10%, transparent 70%);
        opacity: 0.7;
      }
      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(40px);
      }
      .glow.rose {
        width: 620px;
        height: 620px;
        left: -180px;
        top: -260px;
        background: rgba(190, 24, 93, 0.16);
      }
      .glow.lavender {
        width: 640px;
        height: 640px;
        right: -200px;
        top: -120px;
        background: rgba(167, 139, 250, 0.32);
      }
      .content {
        position: absolute;
        left: 88px;
        top: 110px;
        right: 88px;
      }
      .pill {
        display: inline-block;
        padding: 8px 22px;
        border: 2px solid #f5d5e3;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.75);
        color: #be185d;
        font-size: 26px;
        font-weight: 600;
      }
      h1 {
        margin: 28px 0 0;
        font-size: 108px;
        line-height: 1.08;
        font-weight: 800;
        letter-spacing: -2px;
        background: linear-gradient(100deg, #be185d 10%, #6d28d9 90%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 22px 0 0;
        font-size: 38px;
        color: #6e4e64;
      }
      .footer {
        position: absolute;
        left: 88px;
        right: 88px;
        bottom: 70px;
        display: flex;
        justify-content: space-between;
        font-size: 24px;
        color: #6e4e64;
      }
      .footer b {
        color: #be185d;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow rose"></div>
    <div class="glow lavender"></div>
    <div class="content">
      <span class="pill">✦ Full Stack Developer</span>
      <h1>Ghofrane Soulmi</h1>
      <p>Laravel · Vue.js 3 · TypeScript</p>
    </div>
    <div class="footer">
      <span>Tunis, Tunisia</span>
      <span><b>Portfolio</b> &amp; case studies</span>
    </div>
  </body>
</html>
